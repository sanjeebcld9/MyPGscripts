name: Generate README with Gemini AI

on:
  push:
    branches:
      - main            # Change to 'master' if your main branch is called master
  workflow_dispatch:     # Adds a manual 'Run' button in GitHub UI for testing

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Grants workflow permission to push commits to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install readmeai and Gemini SDK
        run: pip install "readmeai[google-generativeai]"

      - name: Generate README with Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing. Please add GEMINI_API_KEY to Repository Secrets."
            exit 1
          fi
          readmeai --api gemini --model gemini-1.5-flash --repository . --output README.md

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f README.md ]; then
            git add README.md
            git diff --staged --quiet || (git commit -m "docs: auto-generate README via Gemini AI" && git push)
          else
            echo "::error::README.md was not generated by readmeai."
            exit 1
          fi
