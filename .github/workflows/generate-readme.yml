name: Generate README with AI

on:
  push:
    branches:
      - main            # Change to 'master' if your main branch is called master
  workflow_dispatch:

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install readmeai
        run: pip install readmeai

      - name: Generate README
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: readmeai -r . -o README.md

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f README.md ]; then
            git add README.md
            git diff --staged --quiet || (git commit -m "docs: auto-generate README via AI" && git push)
          else
            echo "Error: README.md was not generated by readmeai."
            exit 1
          fi
